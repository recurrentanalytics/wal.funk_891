<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="build" content="20261123012725">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whale Listener</title>
<meta name="description" content="A Raspberry Pi listening to open hydrophone archives for whale calls.">
<meta name="theme-color" content="#04121a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
/* Layout: a deep-sea listening station. One dark world, depth gets darker as you scroll from whales to machine. */
:root {
  --abyss: #020b10; --deep: #04121a; --sea: #082230; --shelf: #0e3344; --line: #17465a;
  --fg: #dcecf1; --muted: #7fa2ae; --dim: #4d7280;
  --glow: #5ee6d7;  /* model / instruments */
  --amber: #ffb547; /* what people heard */
  --coral: #ff6b5b; /* alarms, heat */
  --krill: #b7f36a; /* pass */
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--deep); color: var(--fg); font: 16px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
a { color: var(--glow); }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left)); padding-right: max(18px, env(safe-area-inset-right)); }

/* Hero */
.hero { position: relative; min-height: min(78vh, 640px); display: flex; align-items: flex-end; overflow: hidden; background: var(--abyss); }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .55; image-rendering: auto; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(2,11,16,.2) 0%, rgba(2,11,16,.35) 45%, var(--deep) 100%); }
.hero .wrap { position: relative; z-index: 1; padding-block: 120px 40px; width: 100%; }
.eyebrow { font: 500 12px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--glow); }
h1 { font: 300 clamp(3rem, 11vw, 7.5rem)/.92 var(--display); letter-spacing: -.03em; margin: 12px 0 18px; text-wrap: balance; }
.hero p.lede { font-size: clamp(1.05rem, 2.2vw, 1.3rem); max-width: 40ch; color: #b9d3db; margin: 0 0 26px; }
.live { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; font: 13px var(--mono); background: rgba(4,18,26,.7); backdrop-filter: blur(6px); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--krill); box-shadow: 0 0 0 0 rgba(183,243,106,.6); }
@media (prefers-reduced-motion: no-preference) { .dot.on { animation: ping 2s infinite; } }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(183,243,106,.6); } 80%,100% { box-shadow: 0 0 0 10px rgba(183,243,106,0); } }
.dot.hot { background: var(--coral); }
.dot.stale { background: var(--dim); }

/* Menu */
.toc { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: rgba(4,18,26,.88); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.toc .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-block: 8px; }
.toc a { flex: none; padding: 6px 12px; border-radius: 999px; font: 500 13px var(--mono); letter-spacing: .04em; color: var(--muted); text-decoration: none; }
.toc a:hover, .toc a:focus-visible, .toc a.on { color: var(--abyss); background: var(--glow); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 11; background: var(--deep); }

/* Parts */
.part { padding-block: 72px 24px; scroll-margin-top: 50px; }
.part:nth-of-type(2) { background: linear-gradient(180deg, var(--deep), #031018); }
.kicker { font: 500 12px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
h2 { font: 300 clamp(2.1rem, 6vw, 3.6rem)/1 var(--display); letter-spacing: -.02em; margin: 10px 0 14px; text-wrap: balance; }
.intro { color: var(--muted); max-width: 62ch; margin: 0 0 32px; font-size: 1.05rem; }
h3 { font: 500 1rem var(--body); margin: 0 0 10px; }
.note { color: var(--dim); font-size: 13px; max-width: 70ch; }
.panel { background: rgba(8,34,48,.55); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0; }
.mono { font-family: var(--mono); }

/* Species explorer */
.explorer { display: grid; gap: 20px; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 860px) { .explorer { grid-template-columns: minmax(0, 1fr); } }
.lineup { display: grid; gap: 2px; }
.whale-btn { all: unset; cursor: pointer; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; padding: 8px 10px; border-radius: 10px; }
.whale-btn:hover { background: rgba(94,230,215,.06); }
.whale-btn:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
.whale-btn[aria-pressed="true"] { background: rgba(94,230,215,.1); }
.whale-btn .nm { font-size: 14px; }
.whale-btn .len { font: 12px var(--mono); color: var(--muted); }
.whale-btn svg { grid-column: 1 / -1; width: 100%; height: auto; max-height: 80px; display: block; overflow: visible; }
.whale-btn path { fill: #2c6a7e; transition: fill .2s; }
.whale-btn[aria-pressed="true"] path, .whale-btn:hover path { fill: var(--glow); }
.whale-btn.person path { fill: var(--dim); }
.detail { position: sticky; top: 64px; }
.detail .lat { font-style: italic; color: var(--muted); }
.detail h3.big { font: 300 2.2rem/1.05 var(--display); margin: 0 0 4px; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 16px 0; }
.fact { border-top: 1px solid var(--line); padding-top: 8px; }
.fact b { display: block; font: 300 1.5rem/1.1 var(--display); }
.fact span { font: 11px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.pitch { position: relative; height: 54px; margin: 6px 0 2px; }
.pitch .ear { position: absolute; top: 14px; height: 18px; background: repeating-linear-gradient(90deg, rgba(127,162,174,.18) 0 2px, transparent 2px 6px); border-radius: 4px; }
.pitch .band { position: absolute; top: 10px; height: 26px; border-radius: 13px; background: var(--glow); box-shadow: 0 0 18px rgba(94,230,215,.45); min-width: 8px; }
.pitch .band.unsure { background: transparent; border: 1.5px dashed var(--glow); box-shadow: none; }
.pitch .tick { position: absolute; top: 40px; transform: translateX(-50%); font: 10px var(--mono); color: var(--dim); }
.months { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; margin: 6px 0; }
.months i { font: normal 10px/22px var(--mono); text-align: center; color: var(--dim); background: rgba(23,70,90,.45); border-radius: 4px; }
.months i.on { background: var(--glow); color: var(--abyss); }
.detail p { margin: 8px 0; font-size: 14.5px; }
.status-pill { display: inline-block; margin-top: 6px; font: 12px var(--mono); color: var(--amber); border: 1px solid rgba(255,181,71,.4); border-radius: 999px; padding: 3px 10px; }
.src { font-size: 12px; color: var(--dim); }
.known { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); margin-top: 28px; }
.known div { border-left: 2px solid var(--glow); padding-left: 12px; font-size: 14.5px; color: #b9d3db; }

/* Map */
.mapbox { position: relative; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: radial-gradient(120% 90% at 30% 40%, #0a2a3a, #031018 70%); }
.mapbox svg { display: block; width: 100%; height: auto; }
.land { fill: #12303c; stroke: #2a5566; stroke-width: .6; }
.grat { fill: none; stroke: rgba(94,230,215,.07); stroke-width: .6; }
.hp-ring { fill: none; stroke: var(--glow); stroke-width: 1.5; }
@media (prefers-reduced-motion: no-preference) { .hp-ring { animation: sonar 3s ease-out infinite; transform-box: fill-box; transform-origin: center; } .hp-ring.d2 { animation-delay: 1.5s; } }
@keyframes sonar { from { transform: scale(.3); opacity: .9; } to { transform: scale(3.2); opacity: 0; } }
.hp-core { fill: var(--glow); }
.hp-minor { fill: #7fa2ae; }
.map-label { font: 500 12px var(--mono); fill: var(--fg); paint-order: stroke; stroke: #031018; stroke-width: 4px; }
.map-sub { font: 11px var(--mono); fill: var(--muted); paint-order: stroke; stroke: #031018; stroke-width: 4px; }
.place-cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); margin-top: 16px; }
.place-cards .panel b { font: 300 1.4rem var(--display); display: block; }
.place-cards .meta { font: 12px var(--mono); color: var(--muted); margin: 4px 0 8px; }

/* Player */
.player { position: relative; }
.spec-wrap { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--abyss); }
.spec-wrap canvas { display: block; width: 100%; height: clamp(180px, 34vw, 320px); }
.calls-band { position: absolute; left: 0; right: 0; top: 0; height: 100%; pointer-events: none; }
.calls-band span { position: absolute; top: 0; height: 100%; background: rgba(255,181,71,.07); border-left: 1px solid rgba(255,181,71,.35); border-right: 1px solid rgba(255,181,71,.35); transition: background .15s; }
.calls-band span.lit { background: rgba(255,181,71,.24); }
.playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 12px #fff; left: 0; pointer-events: none; opacity: 0; }
.playhead.on { opacity: 1; }
.freq-axis { position: absolute; left: 8px; top: 6px; bottom: 6px; display: flex; flex-direction: column; justify-content: space-between; font: 10px var(--mono); color: rgba(220,236,241,.6); pointer-events: none; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 14px 0; }
.play { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; background: var(--glow); color: var(--abyss); font: 500 15px var(--body); }
.play:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.play svg { width: 14px; height: 14px; }
.readout { font: 13px var(--mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 16px; }
.readout b { color: var(--fg); font-weight: 500; }
.lanes { display: grid; gap: 8px; margin-top: 6px; }
.lane-row { display: grid; grid-template-columns: 112px 1fr; gap: 10px; align-items: center; font: 12px var(--mono); color: var(--muted); }
.lane { position: relative; height: 34px; border-radius: 6px; background: rgba(23,70,90,.35); overflow: hidden; }
.lane .thr { position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed rgba(220,236,241,.35); }
.lane .w { position: absolute; bottom: 0; background: var(--glow); opacity: .85; border-radius: 2px 2px 0 0; transition: filter .15s; }
.lane .w.whalu { background: #7fa2ae; }
.lane .w.now { filter: brightness(1.6); }
.lane .c { position: absolute; top: 6px; bottom: 6px; background: var(--amber); border-radius: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); margin-top: 12px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }

/* Results */
.score-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.verdict { font: 300 clamp(3rem, 9vw, 4.6rem)/1 var(--display); letter-spacing: -.02em; }
.verdict.pass { color: var(--krill); } .verdict.fail { color: var(--coral); } .verdict.wait { color: var(--dim); }
.meter { margin: 12px 0 0; }
.meter .row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.meter .row b { color: var(--fg); font: 500 13px var(--mono); }
.meter .track { position: relative; height: 8px; border-radius: 4px; background: rgba(23,70,90,.6); margin-top: 4px; overflow: hidden; }
.meter .track span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.gauge-line { position: relative; height: 26px; margin-top: 14px; }
.gauge-line .rail { position: absolute; left: 0; right: 0; top: 11px; height: 4px; background: rgba(23,70,90,.8); border-radius: 2px; }
.gauge-line .mark { position: absolute; top: 2px; width: 2px; height: 22px; background: var(--fg); }
.gauge-line .val { position: absolute; top: 5px; width: 16px; height: 16px; border-radius: 50%; transform: translateX(-50%); }
.gauge-line .lbl { position: absolute; top: 28px; transform: translateX(-50%); font: 10px var(--mono); color: var(--dim); white-space: nowrap; }
.gauge-line .lbl.up { top: -14px; }
.gauge-line { margin-top: 26px; }
.gates { list-style: none; padding: 0; margin: 28px 0 0; display: grid; gap: 0; }
.gates li { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
.gates .n { font: 500 13px var(--mono); color: var(--dim); padding-top: 2px; }
.gates .t { font-size: 15px; }
.gates .r { display: block; color: var(--muted); font-size: 13px; }
.gates .s { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; border: 1px solid currentColor; }
.s.pass { color: var(--krill); } .s.fail { color: var(--coral); } .s.running { color: var(--amber); } .s.waiting { color: var(--dim); }

/* Machine */
.instr { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.big-num { font: 300 3rem/1 var(--display); }
.big-num small { font-size: 1.2rem; color: var(--muted); }
.cores { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; align-items: end; margin-top: 10px; }
.core { text-align: center; font: 11px var(--mono); color: var(--muted); }
.core .col { height: 72px; border-radius: 6px; background: rgba(23,70,90,.5); position: relative; overflow: hidden; margin-bottom: 4px; }
.core .col span { position: absolute; left: 0; right: 0; bottom: 0; background: var(--glow); }
.pipe { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); counter-reset: s; }
.pipe li { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; counter-increment: s; }
.pipe li::before { content: "0" counter(s); font: 11px var(--mono); color: var(--dim); display: block; }
.pipe li.on { border-color: var(--glow); background: rgba(94,230,215,.07); }
.pipe b { font-weight: 500; font-size: 14px; }
.pipe .v { display: block; font: 13px var(--mono); color: var(--glow); }
.pipe .n { display: block; font-size: 12px; color: var(--muted); }
.bar { height: 6px; background: rgba(23,70,90,.7); border-radius: 3px; overflow: hidden; margin: 4px 0 10px; }
.bar span { display: block; height: 100%; background: var(--glow); }
.row2 { display: flex; justify-content: space-between; font-size: 13px; }
.tchart svg { width: 100%; height: auto; display: block; }
.tchart text { fill: var(--dim); font: 10px var(--mono); }

/* Glossary + footer */
.gloss { display: grid; gap: 14px 28px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); margin: 0; }
.gloss dt { font: 500 14px var(--mono); color: var(--glow); }
.gloss dd { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
footer { padding-block: 48px; color: var(--dim); font-size: 13px; border-top: 1px solid var(--line); margin-top: 40px; }
.err { color: var(--coral); }
.voices-head { margin-top: 36px; }
.voices { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); margin-top: 12px; }
.voice { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: rgba(8,34,48,.55); }
.voice .vs { position: relative; cursor: pointer; }
.voice canvas { display: block; width: 100%; height: 150px; }
.voice .ph { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 10px #fff; opacity: 0; }
.voice .ax { position: absolute; left: 6px; top: 4px; font: 10px var(--mono); color: rgba(220,236,241,.7); }
.voice .body { padding: 12px 14px 14px; }
.voice h4 { margin: 0; font: 300 1.4rem var(--display); }
.voice .meta { font: 12px var(--mono); color: var(--muted); margin: 4px 0 10px; }
.voice .sc { position: relative; height: 22px; border-radius: 4px; background: rgba(23,70,90,.45); overflow: hidden; margin-top: 10px; }
.voice .sc span { position: absolute; bottom: 0; background: var(--glow); opacity: .8; }
.voice .sc hr { position: absolute; left: 0; right: 0; top: 50%; margin: 0; border: 0; border-top: 1px dashed rgba(220,236,241,.35); }
.play.small { padding: 8px 14px; font-size: 14px; }
.live-card { margin-top: 18px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #020b10; padding-bottom: 12px; }
.live-card .note { padding: 0 18px; }
.live-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 8px 18px 12px; }
.live-row select { background: var(--sea); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; font: 14px var(--body); }
.live-spec { display: block; width: 100%; height: 170px; background: #020b10; }
.rec { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--coral); margin-right: 4px; }
@media (prefers-reduced-motion: no-preference) { .rec { animation: blink 1.4s infinite; } }
@keyframes blink { 50% { opacity: .2; } }
.cal-sum { font: 13px var(--mono); color: var(--muted); margin-bottom: 10px; }
.cal { display: grid; gap: 6px; }
.cal-year { display: grid; grid-template-columns: 38px 1fr; gap: 8px; align-items: center; font: 11px var(--mono); color: var(--dim); }
.cal-days { display: grid; grid-template-columns: repeat(53, 1fr); grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 1px; }
.cal-days i { aspect-ratio: 1; background: rgba(23,70,90,.35); border-radius: 1px; }
.cal-days i.none { background: transparent; }
.cal-days i.on { background: var(--glow); box-shadow: 0 0 6px var(--glow); }
.cands { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); margin-top: 12px; }
.cand { border: 1px dashed var(--line); border-radius: 12px; padding: 14px; }
.cand b { font: 300 1.2rem var(--display); display: block; }
.cand .st { font: 11px var(--mono); color: var(--amber); text-transform: uppercase; letter-spacing: .08em; }
.photo { margin: -18px -18px 16px; position: relative; }
.photo img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 14px 14px 0 0; }
.photo figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 12px 8px; font: 11px var(--mono); color: #cfe3e8; background: linear-gradient(0deg, rgba(2,11,16,.85), transparent); }
.photo figcaption a { color: #cfe3e8; }
.scene-card { margin-top: 18px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #020b10; }
.scene-head { padding: 16px 18px 6px; }
.scene-title { font: 300 1.7rem/1.1 var(--display); margin: 6px 0 4px; }
.scene { position: relative; height: clamp(320px, 52vw, 520px); touch-action: pan-y; cursor: grab; }
.scene.tall { height: clamp(360px, 60vw, 600px); }
.scene canvas { display: block; width: 100% !important; height: 100% !important; }
.scene-msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font: 13px var(--mono); }
.scene-label { position: absolute; transform: translate(-50%, -100%); pointer-events: none; font: 500 12px var(--mono); color: var(--fg); background: rgba(2,11,16,.75); border: 1px solid var(--line); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
.scene-label.amber { color: var(--amber); border-color: rgba(255,181,71,.5); }
.scene-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 10px 18px 14px; font-size: 12px; color: var(--muted); }
.scene-legend i { display: inline-block; width: 26px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
.smap canvas { display: block; width: 100%; aspect-ratio: 16 / 10; max-height: 520px; border-radius: 10px; background: radial-gradient(80% 80% at 50% 50%, #08283a, #020b10); margin-top: 8px; }
.legend input { accent-color: var(--glow); vertical-align: -2px; margin-right: 4px; }

.lang { display: flex; gap: 2px; margin-left: auto; flex: none; }
.lang a { padding: 7px 11px; border-radius: 999px; font: 500 13px var(--mono); color: var(--muted); text-decoration: none; }
.lang [aria-current="true"] { color: var(--abyss); background: var(--fg); }
.lang a:focus-visible { outline: 2px solid var(--glow); }
.lang-top { position: absolute; z-index: 3; top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); background: rgba(4,18,26,.75); border: 1px solid var(--line); border-radius: 999px; padding: 3px; backdrop-filter: blur(6px); }
.toc .wrap { align-items: center; }
.glance { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); margin-top: 28px; }
@media (max-width: 600px) { .glance { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tile b { font-size: 1.1rem; } .tile small { display: none; } .hero { min-height: auto; } .hero .wrap { padding-block: 90px 28px; } }
.tile { display: block; text-decoration: none; color: var(--fg); padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: rgba(4,18,26,.72); backdrop-filter: blur(6px); }
.tile:hover { border-color: var(--glow); }
.tile span { display: block; font: 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tile b { display: block; font: 300 1.45rem/1.2 var(--display); margin: 4px 0 2px; }
.tile small { color: var(--muted); font-size: 12.5px; }
.tile.ok b { color: var(--krill); } .tile.warn b { color: var(--coral); }
.lede-big { font: 300 clamp(1.15rem, 2.4vw, 1.45rem)/1.45 var(--display); color: #c5dce3; max-width: 52ch; margin: 0 0 28px; }
.sub-h { margin: 44px 0 4px; }
.sub-h .scene-title { margin-top: 4px; }
/* the dive */
.dive { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 32px; max-width: 1180px; margin: 0 auto; padding: 24px max(18px, env(safe-area-inset-right)) 24px max(18px, env(safe-area-inset-left)); }
.dive .steps { display: grid; gap: 55vh; padding: 20vh 0 40vh; }
.step { background: rgba(4,18,26,.6); border: 1px solid transparent; border-radius: 14px; padding: 16px 18px; transition: border-color .4s; }
.step.on { border-color: var(--line); }
.step p { font: 300 clamp(1.25rem, 2.6vw, 1.85rem)/1.3 var(--display); margin: 8px 0 0; color: var(--dim); transition: color .5s; }
.step.on p { color: var(--fg); }
.stage { --stage-bg: #0b1a24; position: sticky; top: 64px; height: calc(100vh - 88px); max-height: 760px; border-radius: 18px; overflow: hidden; background: var(--stage-bg); transition: background-color 1s; border: 1px solid var(--line); }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; transition: opacity 1.2s; }
.scene { opacity: 0; transition: opacity .9s; }
.scene.on { opacity: 1; }
.zoom { transition: transform 1.6s cubic-bezier(.3,.1,.2,1); transform-origin: 0 0; }
.cable { stroke-dashoffset: 1200; transition: stroke-dashoffset 2.5s ease-out; }
.zoom.draw-cable .cable { stroke-dashoffset: 0; }
.whale-g { opacity: 0; transition: opacity 1.2s; }
.zoom.show-whale .whale-g { opacity: 1; }
.st-label { font: 500 20px var(--mono); fill: var(--fg); paint-order: stroke; stroke: rgba(2,11,16,.8); stroke-width: 5px; }
.st-label.small { font-size: 13px; stroke-width: 4px; }
.st-tick { font: 12px var(--mono); fill: var(--muted); }
.gauge { position: absolute; left: 16px; top: 16px; bottom: 54px; width: 70px; display: grid; grid-template-rows: auto 1fr auto; justify-items: start; gap: 6px; pointer-events: none; }
.gauge .g-track { width: 5px; height: 100%; border-radius: 3px; background: rgba(127,162,174,.25); position: relative; overflow: hidden; }
.gauge .g-fill { position: absolute; left: 0; right: 0; top: 0; background: var(--glow); box-shadow: 0 0 10px var(--glow); transition: height .9s; }
.gauge .g-v { font: 300 1.5rem var(--display); }
.gauge .g-l { font: 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.st-note { position: absolute; left: 16px; right: 16px; bottom: 10px; font: 11px var(--mono); color: var(--muted); transition: opacity .6s; }
@media (prefers-reduced-motion: no-preference) {
  .led { animation: blink 1.6s infinite; }
  .wifi { animation: wifi 2.4s infinite; opacity: .2; } .w1 { animation-delay: .3s; } .w2 { animation-delay: .6s; }
  .packet { animation: flow 3s linear infinite; offset-rotate: 0deg; }
  .ring { animation: ring 3.2s ease-out infinite; transform-box: fill-box; transform-origin: center; } .r1 { animation-delay: .8s; } .r2 { animation-delay: 1.6s; } .r3 { animation-delay: 2.4s; }
}
@keyframes wifi { 0%, 100% { opacity: .15; } 40% { opacity: 1; } }
@keyframes flow { from { offset-distance: 0%; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } to { offset-distance: 100%; opacity: 0; } }
@keyframes ring { from { transform: scale(.4); opacity: .9; } to { transform: scale(14); opacity: 0; } }
@media (max-width: 860px) {
  .dive { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .stage { grid-row: 1; top: 52px; height: 46vh; z-index: 2; }
  .gauge { width: 56px; bottom: 74px; } .gauge .g-v { font-size: 1.1rem; }
  .st-note { font-size: 9.5px; line-height: 1.35; }
  .dive .steps { grid-row: 2; gap: 46vh; padding: 4vh 0 30vh; position: relative; z-index: 3; }
  .step { background: rgba(4,18,26,.9); }
}
/* world */
.world { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #031018; }
.world svg { display: block; width: 100%; height: auto; }
.world .sphere { fill: #052030; } .world .land { fill: #163845; stroke: #2a5566; stroke-width: .4; }
.wgroup { transition: opacity .3s; } .wgroup.dim { opacity: .12; }
.wused { stroke: #fff; stroke-width: 1.5; }
.world-info { min-height: 22px; font: 12.5px var(--mono); color: var(--muted); padding: 8px 2px; }
.world-info b { color: var(--fg); font-weight: 500; }
.wl-list { display: grid; gap: 6px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); margin-top: 6px; }
.wl-item { all: unset; cursor: pointer; display: grid; grid-template-columns: 14px 1fr; gap: 2px 10px; align-items: center; padding: 8px 10px; border-radius: 10px; border: 1px solid transparent; }
.wl-item:hover, .wl-item.on { border-color: var(--line); background: rgba(94,230,215,.05); }
.wl-item:focus-visible { outline: 2px solid var(--glow); }
.wl-item i { width: 10px; height: 10px; border-radius: 50%; grid-row: span 2; }
.wl-item b { font-weight: 500; font-size: 14px; } .wl-item span { font: 11.5px var(--mono); color: var(--muted); }
.note.check { color: #b9d3db; border-left: 2px solid var(--amber); padding-left: 10px; }
details.more { margin-top: 10px; } details.more summary { cursor: pointer; color: var(--glow); font-size: 14px; }
html[data-lang="zh"] { --display: "Noto Sans SC", "Bricolage Grotesque", system-ui, sans-serif; --body: "Noto Sans SC", "IBM Plex Sans", system-ui, sans-serif; }
html[data-lang="zh"] h1 { letter-spacing: 0; }

.play-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); align-items: start; }
.g-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 8px 0; }
.g-score { font: 12px var(--mono); color: var(--muted); }
.g-bar { height: 6px; border-radius: 3px; background: rgba(23,70,90,.7); overflow: hidden; margin: 6px 0 12px; }
.g-bar span { display: block; height: 100%; width: 0; background: var(--glow); }
.g-q { font: 300 1.3rem/1.3 var(--display); margin: 14px 0 10px; }
.g-ans { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.g-btn { font: 500 15px var(--body); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 12px; padding: 14px; cursor: pointer; }
.g-btn:hover:not(:disabled) { border-color: var(--glow); } .g-btn:disabled { cursor: default; opacity: .65; }
.g-btn.right { border-color: var(--krill); color: var(--krill); opacity: 1; } .g-btn.wrong { border-color: var(--coral); color: var(--coral); opacity: 1; }
.g-reveal { display: grid; gap: 6px; margin-top: 14px; }
.g-truth { font: 500 14px var(--mono); color: var(--amber); margin-bottom: 4px; }
.g-row { display: grid; grid-template-columns: 90px 1fr 20px; gap: 8px; font-size: 14px; padding: 6px 10px; border-radius: 8px; background: rgba(23,70,90,.3); }
.g-row i { font-style: normal; text-align: right; } .g-row.ok i { color: var(--krill); } .g-row.bad i { color: var(--coral); }
.g-reveal .play { justify-self: start; margin-top: 8px; }
.g-final { font: 300 1.6rem/1.3 var(--display); margin: 10px 0; }
.mc-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 10px 0; }
.mc-row select { background: var(--sea); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; font: 14px var(--body); }
.mc-speed { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); } .mc-speed input { accent-color: var(--glow); width: 140px; } .mc-speed b { color: var(--fg); font: 500 13px var(--mono); min-width: 32px; }
.mc-stage { position: relative; border-radius: 10px; overflow: hidden; background: #020b10; border: 1px solid var(--line); }
.mc-stage canvas { display: block; width: 100%; height: 240px; touch-action: none; cursor: crosshair; }
.mc-start { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.ghost { font: 500 14px var(--body); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; cursor: pointer; }
.nb { list-style: none; margin: 0; padding: 0 0 0 22px; border-left: 2px solid var(--line); display: grid; gap: 22px; }
.nb li { position: relative; }
.nb li::before { content: ""; position: absolute; left: -30px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--dim); border: 2px solid var(--deep); }
.nb li.nb-pass::before { background: var(--krill); } .nb li.nb-fail::before { background: var(--coral); } .nb li.nb-running::before { background: var(--amber); }
.nb time { font: 12px var(--mono); color: var(--muted); margin-right: 10px; }
.nb h4 { margin: 6px 0 4px; font: 300 1.3rem var(--display); }
.nb p { margin: 0; color: #b9d3db; max-width: 66ch; font-size: 14.5px; }
.nb-fig { margin-top: 8px; display: flex; gap: 10px; align-items: baseline; } .nb-fig b { font: 300 1.6rem var(--display); color: var(--glow); } .nb-fig span { font-size: 13px; color: var(--muted); }
.s.note { color: var(--muted); }
.area-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.area-chip { display: inline-flex; align-items: center; gap: 8px; font: 13px var(--body); color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.area-chip i { width: 10px; height: 10px; border-radius: 3px; opacity: .45; }
.area-chip[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); } .area-chip[aria-pressed="true"] i { opacity: 1; }
.area-chip:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>

<header class="hero" id="top">
  <canvas id="hero-spec" aria-hidden="true"></canvas>
  <div class="lang lang-top" role="group" aria-label="Language"><a href="?lang=en" data-lang="en" hreflang="en">EN</a><a href="?lang=de" data-lang="de" hreflang="de">DE</a><a href="?lang=zh" data-lang="zh" hreflang="zh">中文</a></div>
  <div class="wrap">
    <div class="eyebrow" data-i18n="hero.eyebrow">Hydrophone listening station</div>
    <h1 data-i18n="hero.title">Whale Listener</h1>
    <p class="lede" data-i18n="hero.lede"></p>
    <div class="live"><span class="chip"><span class="dot stale" id="live-dot"></span><span id="live-text" data-i18n="hero.connecting"></span></span></div>
    <div class="glance" aria-label="At a glance">
      <a class="tile" href="#machine"><span data-i18n="glance.pi"></span><b id="g-pi">—</b></a>
      <a class="tile" href="#finds"><span data-i18n="glance.hours"></span><b id="g-hours">—</b></a>
      <a class="tile ok" href="#results"><span data-i18n="glance.model"></span><b id="g-model">—</b><small data-i18n="glance.model.sub"></small></a>
      <a class="tile warn" href="#machine"><span data-i18n="glance.next"></span><b data-i18n="glance.next.val"></b><small data-i18n="glance.next.sub"></small></a>
    </div>
  </div>
</header>

<nav class="toc" aria-label="Sections"><div class="wrap">
  <a href="#dive" data-i18n="nav.dive"></a><a href="#whales" data-i18n="nav.whales"></a><a href="#places" data-i18n="nav.places"></a><a href="#listen" data-i18n="nav.listen"></a><a href="#try" data-i18n="nav.play"></a><a href="#results" data-i18n="nav.results"></a><a href="#finds" data-i18n="nav.finds"></a><a href="#notebook" data-i18n="nav.notebook"></a><a href="#machine" data-i18n="nav.machine"></a><a href="#words" data-i18n="nav.words"></a>
</div></nav>

<main>
  <section class="dive" id="dive" data-part data-i18n-aria="dive.label">
    <div class="stage" id="stage" aria-hidden="true">
      <svg viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0b2433"/><stop offset="1" stop-color="#1b4a5c"/></linearGradient>
          <linearGradient id="sea" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0f5068"/><stop offset=".45" stop-color="#062a3a"/><stop offset="1" stop-color="#020b10"/></linearGradient>
        </defs>
        <g class="scene" id="sc-pi" data-from="0" data-to="0"></g>
        <g class="scene" id="sc-cloud" data-from="1" data-to="1"></g>
        <g class="scene" id="sc-profile" data-from="2" data-to="4"></g>
      </svg>
      <canvas></canvas>
      <div class="gauge"><div class="g-v" id="st-depth">0 m</div><div class="g-track"><div class="g-fill" id="st-fill"></div></div><div class="g-l" id="st-lbl"></div></div>
      <div class="st-note" id="st-note"></div>
    </div>
    <div class="steps">
      <div class="step" data-i="0"><span class="kicker" data-i18n="dive.s0.k"></span><p data-i18n="dive.s0.t"></p></div>
      <div class="step" data-i="1"><span class="kicker" data-i18n="dive.s1.k"></span><p data-i18n="dive.s1.t"></p></div>
      <div class="step" data-i="2"><span class="kicker" data-i18n="dive.s2.k"></span><p data-i18n="dive.s2.t"></p></div>
      <div class="step" data-i="3"><span class="kicker" data-i18n="dive.s3.k"></span><p data-i18n="dive.s3.t"></p></div>
      <div class="step" data-i="4"><span class="kicker" data-i18n="dive.s4.k"></span><p data-i18n="dive.s4.t"></p></div>
    </div>
  </section>

  <section class="part" id="whales" data-part><div class="wrap">
    <div class="kicker" data-i18n="whales.kicker"></div>
    <h2 data-i18n="whales.title"></h2>
    <p class="lede-big" data-i18n="whales.lede"></p>
    <div class="explorer">
      <div class="panel"><div class="lineup" id="lineup" role="group"></div><p class="note" data-i18n="whales.scale"></p></div>
      <div class="panel detail" id="detail" aria-live="polite">—</div>
    </div>
    <div class="known" id="known"></div>
    <div class="sub-h" id="voices-anchor"><span class="kicker" data-i18n="voices.kicker"></span><h3 class="scene-title" data-i18n="voices.title"></h3>
      <p class="note" data-i18n="voices.lede"></p><p class="note" data-i18n="voices.speed.note"></p></div>
    <div class="voices" id="voices"></div>
    <p class="note" data-i18n="voices.footer"></p>
  </div></section>

  <section class="part" id="places" data-part><div class="wrap">
    <div class="kicker" data-i18n="places.kicker"></div>
    <h2 data-i18n="places.title"></h2>
    <p class="lede-big" data-i18n="places.lede"></p>
    <div class="mapbox" id="map" role="img" data-i18n-aria="places.map.aria"></div>
    <div class="area-bar" id="areas" aria-label="Whale areas"></div>
    <p class="note" data-i18n="areas.note"></p>
    <div class="place-cards" id="place-list"></div>
    <div class="scene-card">
      <div class="scene-head"><span class="kicker" data-i18n="canyon.kicker"></span><h3 class="scene-title" data-i18n="canyon.title"></h3><p class="note" data-i18n="canyon.note"></p></div>
      <div class="scene tall" id="bathy3d"><div class="scene-msg" data-i18n="ui.loading"></div></div>
      <div class="scene-legend"><span><i style="background:linear-gradient(90deg,#0a1f3a,#1d6f8a,#7fd6d0)"></i><span data-i18n="canyon.legend.depth"></span></span><span><i style="background:#5c6b4e"></i><span data-i18n="canyon.legend.land"></span></span><span><i style="background:var(--amber)"></i><span data-i18n="canyon.legend.hp"></span></span><span class="src" data-i18n="canyon.credit"></span></div>
    </div>
    <div class="live-card" id="live-card">
      <div class="scene-head"><span class="kicker"><span class="rec"></span> <span data-i18n="live.kicker"></span></span><h3 class="scene-title" data-i18n="live.title"></h3>
        <p class="note"><span data-i18n="live.note"></span> <b id="live-clock">—</b></p></div>
      <div class="live-row"><select id="live-node" aria-label="Hydrophone"></select><button class="play" id="live-play" type="button"><svg viewBox="0 0 14 14"><path d="M2 1 L13 7 L2 13 Z" fill="currentColor"/></svg><span data-i18n="live.play"></span></button><span class="note" id="live-state"></span></div>
      <canvas id="live-spec" class="live-spec"></canvas>
      <p class="note" data-i18n="live.credit"></p>
      <audio id="live-audio" crossorigin="anonymous" preload="none"></audio>
    </div>
    <div class="sub-h"><span class="kicker" data-i18n="world.kicker"></span><h3 class="scene-title" data-i18n="world.title"></h3><p class="note" data-i18n="world.note"></p></div>
    <div class="world" id="world"></div>
    <div class="world-info" id="world-info"></div>
    <div class="legend"><span><i style="background:#ffb547"></i><span data-i18n="world.used"></span></span><span><i style="background:#5ee6d7"></i><span data-i18n="world.open"></span></span></div>
    <div class="wl-list" id="world-list"></div>
  </div></section>

  <section class="part" id="listen" data-part><div class="wrap">
    <div class="kicker" data-i18n="listen.kicker"></div>
    <h2 data-i18n="listen.title"></h2>
    <p class="lede-big" data-i18n="listen.lede"></p>
    <div class="player">
      <div class="spec-wrap" id="spec-wrap">
        <canvas id="spec"></canvas><div class="calls-band" id="calls-band"></div><div class="playhead" id="playhead"></div>
        <div class="freq-axis"><span>10 kHz</span><span>5 kHz</span><span>0</span></div>
      </div>
      <div class="controls">
        <button class="play" id="play" type="button"><svg viewBox="0 0 14 14" id="play-icon"><path d="M2 1 L13 7 L2 13 Z" fill="currentColor"/></svg><span id="play-text" data-i18n="listen.play"></span></button>
        <div class="readout"><span><span data-i18n="listen.time"></span> <b id="r-t">0.0 s</b></span><span><span data-i18n="listen.people"></span> <b id="r-p">—</b></span><span>whalu <b id="r-w">—</b></span><span>Perch <b id="r-c">—</b></span></div>
      </div>
      <div class="lanes" id="lanes"></div>
      <div class="legend"><span><i style="background:var(--amber)"></i><span data-i18n="listen.legend.people"></span></span><span><i style="background:#7fa2ae"></i><span data-i18n="listen.legend.whalu"></span></span><span><i style="background:var(--glow)"></i><span data-i18n="listen.legend.perch"></span></span><span data-i18n="listen.legend.thr"></span></div>
      <audio id="audio" preload="none" src="data/clip.mp3"></audio>
      <p class="note" id="clipnote" data-i18n="listen.audio"></p>
    </div>
    <div class="scene-card">
      <div class="scene-head"><span class="kicker" data-i18n="land.kicker"></span><h3 class="scene-title" data-i18n="land.title"></h3><p class="note" data-i18n="land.note"></p></div>
      <div class="scene" id="land3d"><div class="scene-msg" data-i18n="ui.loading"></div></div>
    </div>
  </div></section>

  <section class="part" id="try" data-part><div class="wrap">
    <div class="kicker" data-i18n="play.kicker"></div>
    <h2 data-i18n="play.title"></h2>
    <p class="lede-big" data-i18n="play.lede"></p>
    <div class="play-grid">
      <div class="panel game" id="game-panel"><span class="kicker" data-i18n="game.kicker"></span><h3 class="scene-title" data-i18n="game.title"></h3><p class="note" data-i18n="game.intro"></p><div id="game"></div></div>
      <div class="panel mc">
        <span class="kicker" data-i18n="mc.kicker"></span><h3 class="scene-title" data-i18n="mc.title"></h3><p class="note" data-i18n="mc.intro"></p>
        <div class="mc-row"><select id="mc-clip" data-i18n-aria="mc.clip"></select>
          <label class="mc-speed"><span data-i18n="mc.speed"></span> <input type="range" id="mc-speed" min="1" max="10" step="1" value="1"> <b id="mc-speedv">1×</b></label></div>
