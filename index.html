<style>
/* Layout: a deep-sea listening station. One dark world, depth gets darker as you scroll from whales to machine. */
:root {
  --abyss: #020b10; --deep: #04121a; --sea: #082230; --shelf: #0e3344; --line: #17465a;
  --fg: #dcecf1; --muted: #7fa2ae; --dim: #4d7280;

* { box-sizing: border-box; }

.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left)); padding-right: max(18px, env(safe-area-inset-right)); }

.hero .wrap { position: relative; z-index: 1; padding-block: 120px 40px; width: 100%; }
.eyebrow { font: 500 12px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--glow); }
h1 { font: 300 clamp(3rem, 11vw, 7.5rem)/.92 var(--display); letter-spacing: -.03em; margin: 12px 0 18px; text-wrap: balance; }
.hero p.lede { font-size: clamp(1.05rem, 2.2vw, 1.3rem); max-width: 40ch; color: #b9d3db; margin: 0 0 26px; }
.live { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; font: 13px var(--mono); background: rgba(4,18,26,.7); backdrop-filter: blur(6px); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--krill); box-shadow: 0 0 0 0 rgba(183,243,106,.6); }

.dot.hot { background: var(--coral); }

/* Menu */
.toc { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: rgba(4,18,26,.88); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.toc .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-block: 8px; }

/* Map */
.mapbox { position: relative; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: radial-gradient(120% 90% at 30% 40%, #0a2a3a, #031018 70%); }

.hp-ring { fill: none; stroke: var(--glow); stroke-width: 1.5; }
@media (prefers-reduced-motion: no-preference) { .hp-ring { animation: sonar 3s ease-out infinite; transform-box: fill-box; transform-origin: center; } .hp-ring.d2 { animation-delay: 1.5s; } }
@keyframes sonar { from { transform: scale(.3); opacity: .9; } to { transform: scale(3.2); opacity: 0; } }
.hp-core { fill: var(--glow); }
.hp-minor { fill: #7fa2ae; }
.map-label { font: 500 12px var(--mono); fill: var(--fg); paint-order: stroke; stroke: #031018; stroke-width: 4px; }
.map-sub { font: 11px var(--mono); fill: var(--muted); paint-order: stroke; stroke: #031018; stroke-width: 4px; }
.place-cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); margin-top: 16px; }
.place-cards .panel b { font: 300 1.4rem var(--display); display: block; }

/* Player */

.calls-band span.lit { background: rgba(255,181,71,.24); }

.freq-axis { position: absolute; left: 8px; top: 6px; bottom: 6px; display: flex; flex-direction: column; justify-content: space-between; font: 10px var(--mono); color: rgba(220,236,241,.6); pointer-events: none; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 14px 0; }

.play:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
